name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 bundles npm 11 — the lockfile is npm-11 generated, and
          # npm 10 (bundled with Node 22) rejects it as out of sync.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library + type-contract tests
        run: npm run verify

      - name: Bundle tree-shaking probe
        run: npm run probe

      - name: Server-side render of every smoke screen (zoneless, platform-server)
        run: npm run ssr

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Runtime binding tests (zoneless smoke app)
        run: npm run e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
